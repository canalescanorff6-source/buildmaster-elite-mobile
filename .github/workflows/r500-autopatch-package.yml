name: R500 Temporary Package Gate Patch

on:
  push:
    branches: [r500-autonomous-tactical-director]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r500-autonomous-tactical-director
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Patch package.json deterministically
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const r500 = [
            'node -r ./tests/_ts-require.cjs tests/v40-80-r500-contract-regression.ts',
            'node -r ./tests/_ts-require.cjs tests/v40-80-r500-pro-meta-regression.ts',
            'node -r ./tests/_ts-require.cjs tests/v40-80-r500-memory-regression.ts',
            'node -r ./tests/_ts-require.cjs tests/v40-80-r500-engine-regression.ts',
            'node -r ./tests/_ts-require.cjs tests/v40-80-r500-r489-links-regression.ts',
            'node tests/v40-80-r500-ui-regression.mjs',
            'node tests/v40-80-r500-team-integration-regression.mjs',
            'node tests/v40-80-r500-match-integration-regression.mjs',
            'node -r ./tests/_ts-require.cjs tests/v40-80-r500-closure-regression.ts',
            'node tests/v40-80-r500-ci-gate-regression.mjs'
          ].join(' && ');
          pkg.scripts['test:r500'] = r500;
          const gate = String(pkg.scripts['ci:gate'] || '');
          if (!gate.includes('npm run test:r500')) {
            if (!gate.includes('npm run test:r489')) throw new Error('ci:gate sem ancora test:r489');
            pkg.scripts['ci:gate'] = gate.replace('npm run test:r489', 'npm run test:r489 && npm run test:r500');
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Self-remove temporary workflow
        run: rm .github/workflows/r500-autopatch-package.yml
      - name: Commit package gate patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json .github/workflows/r500-autopatch-package.yml
          git commit -m "R500: registrar test:r500 no gate da main"
          git push origin HEAD:r500-autonomous-tactical-director
