name: Publicar contas e licenças no Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Aplicar banco e Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir Secrets obrigatórios
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Vincular projeto Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migrações do banco
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Configurar busca protegida de fichas Pro
        run: |
          if [ -n "$YOUTUBE_DATA_API_KEY" ]; then
            supabase secrets set YOUTUBE_DATA_API_KEY="$YOUTUBE_DATA_API_KEY" --project-ref "$SUPABASE_PROJECT_ID"
            echo "YouTube Data API configurada no servidor."
          else
            echo "::warning::YOUTUBE_DATA_API_KEY não configurada. O app usará a pesquisa exata por link como fallback."
          fi

      - name: Publicar Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Confirmar funções publicadas
        run: |
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" | tee functions-list.txt
          grep -q 'license-session' functions-list.txt
          grep -q 'admin-users' functions-list.txt
          grep -q 'account-deletion-request' functions-list.txt
          grep -q 'play-integrity-verify' functions-list.txt
          grep -q 'pro-build-search' functions-list.txt
