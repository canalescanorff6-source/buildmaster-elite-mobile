name: Gerar AAB v38.40 Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Canal Google Play
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      publish_to_play:
        description: Publicar no Play Console depois dos testes
        type: boolean
        default: false
      rollout_percentage:
        description: Percentual da produção (1 a 100)
        type: string
        default: '100'
      release_status:
        description: Estado da release
        type: choice
        options: [draft, completed, inProgress, halted]
        default: draft
      source_ref:
        description: Commit ou tag a compilar
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: buildmaster-play-${{ github.event.inputs.track || 'internal' }}
  cancel-in-progress: false

jobs:
  play-store:
    name: Testes, AAB assinado e publicação opcional
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PLAY_PACKAGE_NAME: com.buildmaster.elitetatico
      PLAY_TRACK: ${{ github.event.inputs.track || 'internal' }}
      BUNDLETOOL_VERSION: 1.18.3
      NEXT_PUBLIC_BUILDMASTER_DISTRIBUTION: play
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GOOGLE_PLAY_CLOUD_PROJECT_NUMBER: ${{ vars.GOOGLE_PLAY_CLOUD_PROJECT_NUMBER }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Carregar versão v38.40 do pacote
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "38.40.0" || { echo "::error::package.json precisa estar em 38.40.0"; exit 1; }
          echo "BUILDMASTER_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILDMASTER_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BUILDMASTER_NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android API 36
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Validar Secrets e Variables obrigatórios
        env:
          UPLOAD_KEY: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_BUNDLE }}
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$UPLOAD_KEY" || { echo '::error::GOOGLE_PLAY_UPLOAD_KEY_BUNDLE ausente.'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo '::error::NEXT_PUBLIC_SUPABASE_URL ausente.'; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo '::error::NEXT_PUBLIC_SUPABASE_ANON_KEY ausente.'; exit 1; }
          [[ "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]] || { echo '::error::NEXT_PUBLIC_SUPABASE_URL não é uma URL válida do Supabase.'; exit 1; }
          [[ "$NEXT_PUBLIC_SUPABASE_URL" != *example* ]] || { echo '::error::A URL ainda está com o valor de exemplo.'; exit 1; }
          [[ "$NEXT_PUBLIC_SUPABASE_ANON_KEY" == sb_publishable_* || "$NEXT_PUBLIC_SUPABASE_ANON_KEY" == eyJ* ]] || { echo '::error::Use uma Publishable key ou a chave anon pública.'; exit 1; }
          [[ "$NEXT_PUBLIC_SUPABASE_ANON_KEY" != *test* ]] || { echo '::error::A chave ainda está com valor de teste.'; exit 1; }
          test -n "$NEXT_PUBLIC_GOOGLE_PLAY_CLOUD_PROJECT_NUMBER" || { echo '::error::GOOGLE_PLAY_CLOUD_PROJECT_NUMBER ausente.'; exit 1; }
          if [ "${{ github.event.inputs.publish_to_play }}" = 'true' ]; then
            test -n "$SERVICE_ACCOUNT" || { echo '::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ausente para publicação.'; exit 1; }
          fi

      - name: Verificar servidor Supabase antes de gerar o AAB
        run: |
          BASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/}"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/buildmaster-supabase-health.json --write-out '%{http_code}' \
            --connect-timeout 12 --max-time 25 \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --header 'Accept: application/json' \
            "$BASE_URL/auth/v1/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::O servidor Supabase configurado não respondeu corretamente (HTTP ${HTTP_CODE:-000}). Confira se o projeto está ativo e se URL/chave pertencem ao mesmo projeto."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/buildmaster-supabase-health.json';
          let payload;
          try { payload = JSON.parse(fs.readFileSync(file, 'utf8')); }
          catch { console.error('::error::O endpoint de saúde do Supabase não retornou JSON válido.'); process.exit(1); }
          if (payload?.name !== 'GoTrue' || typeof payload?.version !== 'string' || !payload.version.trim()) {
            console.error('::error::A URL respondeu, mas não corresponde a um servidor Supabase Auth válido.');
            process.exit(1);
          }
          NODE

      - name: Verificar função crítica de licença
        run: |
          BASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/}"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/buildmaster-license-preflight.txt --write-out '%{http_code}' \
            --request OPTIONS --connect-timeout 12 --max-time 25 \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --header 'Origin: capacitor://localhost' \
            --header 'Access-Control-Request-Method: POST' \
            "$BASE_URL/functions/v1/license-session" || true)"
          case "$HTTP_CODE" in
            200|204|400|401|403|405|426) ;;
            404|000|5??)
              echo "::error::A rota Supabase license-session não está disponível (HTTP ${HTTP_CODE:-000}). Publique as Edge Functions antes de gerar o aplicativo."
              cat /tmp/buildmaster-license-preflight.txt 2>/dev/null || true
              exit 1
              ;;
            *)
              echo "::error::Resposta inesperada da rota license-session (HTTP ${HTTP_CODE:-000})."
              cat /tmp/buildmaster-license-preflight.txt 2>/dev/null || true
              exit 1
              ;;
          esac
          echo "Rota license-session encontrada no projeto Supabase (HTTP $HTTP_CODE)."

      - name: Instalar dependências travadas
        run: npm ci --no-audit --no-fund

      - name: Restaurar e validar configuração TypeScript raiz
        run: npm run types:repair && npm run quality:root-tsconfig

      - name: Recuperar e validar rota inicial
        run: npm run quality:routes

      - name: Diagnóstico consolidado de qualidade e Google Play
        timeout-minutes: 35
        run: |
          npm run ci:verify
          npm run release:play-preflight

      - name: Gerar e verificar manifesto do código-fonte
        timeout-minutes: 4
        run: |
          npm run integrity:generate
          npm run integrity:verify

      - name: Gerar site estático para Capacitor
        run: npm run apk:build-web

      - name: Validar orçamento do bundle compilado
        timeout-minutes: 3
        run: npm run quality:bundle-built

      - name: Validar exportação estática completa
        run: npm run quality:static-export

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android
          node scripts/install-android-security-plugin.mjs
          node scripts/install-match-recorder-plugin.mjs
          node scripts/install-background-ocr-plugin.mjs
          node scripts/install-native-vault-storage-plugin.mjs
          node scripts/install-play-store-bridge.mjs
          node scripts/install-android-branding.mjs
          npx cap sync android

      - name: Fixar compileSdk e targetSdk API 36
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          text=p.read_text()
          import re
          text=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          text=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          text=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 23', text)
          p.write_text(text)
          PY
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          ! grep -R 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || { echo '::error::Permissão INTERNET ausente no AAB.'; exit 1; }
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml || { echo '::error::Permissão de estado da rede ausente no AAB.'; exit 1; }

      - name: Calcular versionCode monotônico
        run: |
          VERSION_CODE=$((2110200000 + ${{ github.run_number }} * 10 + ${{ github.run_attempt }}))
          test "$VERSION_CODE" -le 2147483647 || { echo '::error::versionCode ultrapassou o limite Android.'; exit 1; }
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "AAB_NAME=BuildMaster-Elite-Tatico-v${BUILDMASTER_VERSION}-${VERSION_CODE}.aab" >> "$GITHUB_ENV"

      - name: Preparar chave de upload para Play App Signing
        env:
          UPLOAD_KEY: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_BUNDLE }}
        run: |
          python - <<'PY'
          import os, json, base64, pathlib, subprocess
          data = json.loads(os.environ['UPLOAD_KEY'])
          required = ['keystoreBase64', 'storePassword', 'keyAlias', 'keyPassword']
          missing = [key for key in required if not str(data.get(key, '')).strip()]
          if missing:
              raise SystemExit('Campos ausentes no bundle da chave: ' + ', '.join(missing))
          for key in ('storePassword', 'keyAlias', 'keyPassword'):
              print(f"::add-mask::{data[key]}")
          android = pathlib.Path('android')
          android.joinpath('upload-key.jks').write_bytes(base64.b64decode(data['keystoreBase64'], validate=True))
          def escape_property(value):
              return str(value).replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          android.joinpath('keystore.properties').write_text(
              '\n'.join([
                  'storeFile=upload-key.jks',
                  'storePassword=' + escape_property(data['storePassword']),
                  'keyAlias=' + escape_property(data['keyAlias']),
                  'keyPassword=' + escape_property(data['keyPassword'])
              ]) + '\n', encoding='utf-8'
          )
          subprocess.run([
              'keytool', '-list', '-keystore', str(android / 'upload-key.jks'),
              '-storepass', str(data['storePassword']), '-alias', str(data['keyAlias'])
          ], check=True, stdout=subprocess.DEVNULL)
          PY
          chmod 600 android/upload-key.jks android/keystore.properties

      - name: Configurar assinatura e versão do bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, os
          p = Path('android/app/build.gradle')
          t = p.read_text()
          preamble = '\n'.join([
              "def buildMasterKeystoreProperties = new Properties()",
              "def buildMasterKeystoreFile = rootProject.file('keystore.properties')",
              "if (!buildMasterKeystoreFile.exists()) { throw new GradleException('keystore.properties ausente') }",
              "buildMasterKeystoreProperties.load(new FileInputStream(buildMasterKeystoreFile))",
              ""
          ]) + '\n'
          if 'buildMasterKeystoreProperties' not in t:
              t = preamble + t
          marker = 'android {'
          signing = '\n'.join([
              'android {',
              '    signingConfigs {',
              '        release {',
              "            storeFile file(buildMasterKeystoreProperties['storeFile'])",
              "            storePassword buildMasterKeystoreProperties['storePassword']",
              "            keyAlias buildMasterKeystoreProperties['keyAlias']",
              "            keyPassword buildMasterKeystoreProperties['keyPassword']",
              '        }',
              '    }'
          ])
          t = t.replace(marker, signing, 1)
          t = re.sub(r'versionCode\s+\d+', f'versionCode {os.environ["ANDROID_VERSION_CODE"]}', t, count=1)
          t = re.sub(r'versionName\s+"[^"]+"', f'versionName "{os.environ["BUILDMASTER_VERSION"]}"', t, count=1)
          t = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', t, count=1)
          p.write_text(t)
          PY

      - name: Pré-compilar Java nativo do AAB
        timeout-minutes: 10
        working-directory: android
        run: ./gradlew --no-daemon :app:compileReleaseJavaWithJavac

      - name: Gerar Android App Bundle release
        working-directory: android
        run: ./gradlew --no-daemon clean bundleRelease

      - name: Validar assinatura, bundletool e identidade do AAB
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -strict -verbose -certs "$AAB" >/dev/null
          curl --fail --location --retry 3 --output bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar validate --bundle "$AAB"
          VERSION_FROM_BUNDLE=$(java -jar bundletool.jar dump manifest --bundle "$AAB" --xpath /manifest/@android:versionCode)
          NAME_FROM_BUNDLE=$(java -jar bundletool.jar dump manifest --bundle "$AAB" --xpath /manifest/@android:versionName)
          test "$VERSION_FROM_BUNDLE" = "$ANDROID_VERSION_CODE"
          test "$NAME_FROM_BUNDLE" = "$BUILDMASTER_VERSION"
          mv "$AAB" "$AAB_NAME"
          sha256sum "$AAB_NAME" | tee "$AAB_NAME.sha256"
          unzip -l "$AAB_NAME" | grep -q 'base/manifest/AndroidManifest.xml'
          rm -f bundletool.jar android/keystore.properties android/upload-key.jks

      - name: Publicar artefato para homologação
        uses: actions/upload-artifact@v6
        with:
          name: buildmaster-play-v38-40-${{ env.ANDROID_VERSION_CODE }}
          path: |
            ${{ env.AAB_NAME }}
            ${{ env.AAB_NAME }}.sha256
            play-store/
          if-no-files-found: error
          retention-days: 30

      - name: Autenticar na API Android Publisher
        id: play-auth
        if: ${{ github.event.inputs.publish_to_play == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Publicar no canal selecionado
        if: ${{ github.event.inputs.publish_to_play == 'true' }}
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          AAB_PATH: ${{ env.AAB_NAME }}
          PLAY_RELEASE_STATUS: ${{ github.event.inputs.release_status || 'draft' }}
          ROLLOUT_PERCENTAGE: ${{ github.event.inputs.rollout_percentage || '100' }}
        run: |
          export PLAY_USER_FRACTION=$(python -c "import os; print(max(1,min(100,int(os.environ.get('ROLLOUT_PERCENTAGE','100'))))/100)")
          export PLAY_RELEASE_NOTES_FILE="play-store/listing/pt-BR/release-notes/${BUILDMASTER_VERSION}.txt"
          test -s "$PLAY_RELEASE_NOTES_FILE" || { echo "::error::Notas da versão ${BUILDMASTER_VERSION} ausentes para publicação na Play Store."; exit 1; }
          node scripts/publish-play-store.mjs
