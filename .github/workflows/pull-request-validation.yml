name: Validar Pull Request BuildMaster

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildmaster-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, R454-R455 e build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Regressão R483 — contrato read-only (TDD)
        run: node -r ./tests/_ts-require.cjs tests/v40-80-r483-build-simulator-regression.ts

      - name: Regressão R484 — Chemistry Graph read-only (TDD)
        run: node -r ./tests/_ts-require.cjs tests/v40-80-r484-chemistry-graph-regression.ts

      - name: Regressão R489 — Explainable AI read-only (TDD)
        run: node -r ./tests/_ts-require.cjs tests/v40-80-r489-explainable-ai-regression.ts

      - name: Regressão R489 — closure explicável (TDD)
        run: node -r ./tests/_ts-require.cjs tests/v40-80-r489-explainable-ai-closure-regression.ts

      - name: Regressão R489 — painel explicável read-only (TDD)
        run: node tests/v40-80-r489-explainable-ai-ui-regression.mjs

      - name: Verificação R483 — superfícies legadas do Resultado
        run: |
          npm run test:r192
          npm run test:r189
          npm run typecheck:v3170
          npm run test:v3176
          npm run test:v3177

      - name: Selo R128 — autoridade final preservada
        run: npm run test:r128

      - name: TypeScript
        run: npm run typecheck

      - name: TypeScript completo do APK
        run: npm run typecheck:r151

      - name: Closure inicial R200
        run: node scripts/check-cardvision-static-closure-r200.mjs

      - name: R473 — detectar testes com arquivos removidos
        run: node scripts/check-stale-test-file-references-r473.mjs

      - name: Regressão R178 — closure estática da experiência
        run: npm run test:r178

      - name: Regressão R180 — auditoria global e módulos órfãos
        run: npm run test:r180

      - name: Regressão R165 — bootstrap leve de backup
        run: npm run test:r165

      - name: Regressão R167 — storage leve de treino e coach
        run: npm run test:r167

      - name: Regressão R177 — lifecycle de startup
        run: npm run test:r177

      - name: Regressão R175 — boundary da Central e UI aposentada
        run: npm run test:r175

      - name: Regressões R454
        run: npm run test:r454

      - name: Regressões R455
        run: npm run test:r455

      - name: Regressões R470 — IA local e aprendizado
        run: npm run test:r470

      - name: Regressões R471 — sync offline-first
        run: npm run test:r471

      - name: Regressões R472 — Motor Lab lifecycle
        run: npm run test:r472

      - name: Regressões R473 — Clean Experience
        run: npm run test:r473

      - name: Regressão R474 — telemetria global unificada
        run: npm run test:r474

      - name: Regressão R480 — Tactical Twin read-only
        run: npm run test:r480

      - name: Regressão R481 — Squad Brain read-only
        run: npm run test:r481

      - name: Regressão R482 — Match Vision read-only
        run: npm run test:r482

      - name: Regressão v38.40 — abertura Android e boundaries
        run: node tests/v38-40-definitive-android-opening-regression.mjs

      - name: Build de produção
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
