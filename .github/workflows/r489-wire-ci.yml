name: R489 Wire CI (temporary)

on:
  push:
    branches: [r489-explainable-ai-design]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r489-explainable-ai-design
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Wire R489 package and PR gates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts['test:r489'] = 'node -r ./tests/_ts-require.cjs tests/v40-80-r489-explainable-ai-regression.ts';
          if (!pkg.scripts['ci:gate'].includes('npm run test:r489')) {
            pkg.scripts['ci:gate'] = pkg.scripts['ci:gate'].replace(
              'npm run test:r482 && npm run test:r417',
              'npm run test:r482 && npm run test:r489 && npm run test:r417'
            );
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const workflowPath = '.github/workflows/pull-request-validation.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          workflow = workflow.replace(
            'run: node -r ./tests/_ts-require.cjs tests/v40-80-r489-explainable-ai-regression.ts',
            'run: npm run test:r489'
          );
          fs.writeFileSync(workflowPath, workflow);
          NODE
      - name: Commit branch-only wiring
        run: |
          if git diff --quiet -- package.json .github/workflows/pull-request-validation.yml; then
            echo 'R489 CI wiring already present.'
            exit 0
          fi
          git config user.name 'buildmaster-r489[bot]'
          git config user.email 'buildmaster-r489[bot]@users.noreply.github.com'
          git add package.json .github/workflows/pull-request-validation.yml
          git commit -m 'R489: fixar test script e gates de CI'
          git push origin HEAD:r489-explainable-ai-design
