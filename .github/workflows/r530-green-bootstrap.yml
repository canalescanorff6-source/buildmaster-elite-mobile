name: Bootstrap GREEN R530

on:
  push:
    branches: [docs/r-vis-0-redesign-closure-plan]
    paths:
      - scripts/r530-green-bootstrap.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch isolada
        uses: actions/checkout@v5
        with:
          ref: docs/r-vis-0-redesign-closure-plan
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Aplicar GREEN R530
        run: node scripts/r530-green-bootstrap.mjs

      - name: Confirmar alterações esperadas
        run: |
          grep -q '"test:r530"' package.json
          grep -q 'EXPECTED_FULL_GROUPS = 98' scripts/ci-doctor-config.mjs
          grep -q 'Fechamento visual R530' scripts/ci-doctor.mjs
          grep -q 'EXPECTED_FULL_GROUPS, 98' tests/v40-80-r534-ci-doctor-sharding-regression.mjs
          git diff --check

      - name: Commitar GREEN na branch
        run: |
          git config user.name 'buildmaster-ci'
          git config user.email 'buildmaster-ci@users.noreply.github.com'
          git add package.json scripts/ci-doctor-config.mjs scripts/ci-doctor.mjs tests/v40-80-r534-ci-doctor-sharding-regression.mjs
          git commit -m 'test(ui): alinhar R530 ao contrato R534'
          git push origin HEAD:docs/r-vis-0-redesign-closure-plan
