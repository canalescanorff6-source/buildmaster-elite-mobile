name: R483 TDD Build Simulator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r483:
    name: R483 contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Executar regressão R483
        run: node -r ./tests/_ts-require.cjs tests/v40-80-r483-build-simulator-regression.ts
