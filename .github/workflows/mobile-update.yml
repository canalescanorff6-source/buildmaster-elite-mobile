name: Aplicar atualização mobile

on:
  push:
    branches: [mobile-inbox]
    paths:
      - mobile-update.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buildmaster-mobile-update
  cancel-in-progress: false

jobs:
  apply-mobile-update:
    name: Validar pacote e aplicar na main
    if: github.ref == 'refs/heads/mobile-inbox'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar caixa de entrada mobile
        uses: actions/checkout@v5
        with:
          ref: mobile-inbox
          path: inbox
          fetch-depth: 1

      - name: Baixar main atual
        uses: actions/checkout@v5
        with:
          ref: main
          path: repo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar e extrair atualização
        id: package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, shutil, subprocess, zipfile

          archive = Path('inbox/mobile-update.zip')
          repo = Path('repo').resolve()
          staging = Path('/tmp/buildmaster-mobile-update')

          if not archive.is_file():
              raise SystemExit('mobile-update.zip não foi encontrado na branch mobile-inbox.')

          blocked_roots = {
              '.git', 'node_modules', '.next', 'out'
          }

          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              if '.mobile-update.json' not in names:
                  raise SystemExit('Pacote inválido: .mobile-update.json ausente.')
              meta = json.loads(z.read('.mobile-update.json').decode('utf-8'))

              if meta.get('schema') != 1 or meta.get('project') != 'buildmaster-elite-mobile':
                  raise SystemExit('Pacote não pertence ao BuildMaster ou usa schema incompatível.')

              base = str(meta.get('baseCommit') or '').strip()
              if base:
                  subprocess.run(
                      ['git', '-C', str(repo), 'merge-base', '--is-ancestor', base, 'HEAD'],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )

              manifest = meta.get('files')
              if not isinstance(manifest, list) or not manifest:
                  raise SystemExit('Pacote sem lista de arquivos.')

              expected = {}
              for item in manifest:
                  path = str(item.get('path') or '')
                  digest = str(item.get('sha256') or '').lower()
                  if not path or len(digest) != 64:
                      raise SystemExit('Manifesto de arquivo inválido.')
                  expected[path] = digest

              if staging.exists():
                  shutil.rmtree(staging)
              staging.mkdir(parents=True)

              for path, digest in expected.items():
                  pp = PurePosixPath(path)
                  if pp.is_absolute() or '..' in pp.parts or not pp.parts:
                      raise SystemExit(f'Caminho inseguro no pacote: {path}')
                  if pp.parts[0] in blocked_roots:
                      raise SystemExit(f'Caminho bloqueado no pacote: {path}')
                  if len(pp.parts) >= 2 and pp.parts[0] == '.github' and pp.parts[1] == 'workflows':
                      raise SystemExit('Atualizações mobile não podem alterar workflows do GitHub.')
                  if path not in names:
                      raise SystemExit(f'Arquivo listado não existe no ZIP: {path}')
                  data = z.read(path)
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != digest:
                      raise SystemExit(f'SHA-256 inválido: {path}')
                  target = staging.joinpath(*pp.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

          for source in staging.rglob('*'):
              if not source.is_file():
                  continue
              rel = source.relative_to(staging)
              target = repo / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          message = str(meta.get('commitMessage') or 'Aplica atualização mobile do BuildMaster').strip()
          message = message.splitlines()[0][:120] or 'Aplica atualização mobile do BuildMaster'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'commit_message={message}\n')
              fh.write(f'file_count={len(expected)}\n')
          PY

      - name: Conferir alterações
        working-directory: repo
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)" || { echo '::error::O pacote não alterou nenhum arquivo.'; exit 1; }

      - name: Criar commit e enviar para main
        working-directory: repo
        env:
          COMMIT_MESSAGE: ${{ steps.package.outputs.commit_message }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:main

      - name: Resumo
        run: |
          echo "### Atualização mobile aplicada" >> "$GITHUB_STEP_SUMMARY"
          echo "- Arquivos: ${{ steps.package.outputs.file_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ steps.package.outputs.commit_message }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Destino: main" >> "$GITHUB_STEP_SUMMARY"
