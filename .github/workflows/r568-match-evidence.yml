name: R568 — Match Evidence Lab
on:
  pull_request:
    paths:
      - 'src/lib/matchEvidenceLabR568.ts'
      - 'src/components/MatchEvidenceLabR568.tsx'
      - 'src/components/MatchValidationCenter.tsx'
      - 'tests/r568-match-evidence-regression.ts'
      - '.github/workflows/r568-match-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/matchEvidenceLabR568.ts'
      - 'tests/r568-match-evidence-regression.ts'
jobs:
  match-evidence:
    name: A/B com amostras e métricas observadas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regressão R568
        run: node -r ./tests/_ts-require.cjs tests/r568-match-evidence-regression.ts
