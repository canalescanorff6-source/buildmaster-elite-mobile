name: R569 — Qualidade do OCR
on:
  pull_request:
    paths:
      - 'src/lib/readerEvidenceQualityR569.ts'
      - 'src/modules/card-reader-v2/readerV2Review.ts'
      - 'src/modules/card-reader-v2/readerV2Types.ts'
      - 'tests/r569-reader-evidence-quality-regression.ts'
      - '.github/workflows/r569-reader-evidence-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/readerEvidenceQualityR569.ts'
      - 'tests/r569-reader-evidence-quality-regression.ts'
jobs:
  reader-quality:
    name: Cobertura de atributos e evidências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Regressão R569
        run: node -r ./tests/_ts-require.cjs tests/r569-reader-evidence-quality-regression.ts
