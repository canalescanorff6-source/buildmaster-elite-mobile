name: R572 — Formação personalizável Meu Time
on:
  pull_request:
    paths:
      - 'src/lib/myTeamFormationPreferenceR572.ts'
      - 'src/components/CardVisionApp.tsx'
      - 'src/modules/squad/IntegratedTeamLab.tsx'
      - 'tests/r572-my-team-formation-picker-regression.ts'
      - '.github/workflows/r572-my-team-formation-picker.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/myTeamFormationPreferenceR572.ts'
      - 'src/components/CardVisionApp.tsx'
      - 'src/modules/squad/IntegratedTeamLab.tsx'
      - 'tests/r572-my-team-formation-picker-regression.ts'
jobs:
  formation:
    name: Seletor visível e preferência por conta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node -r ./tests/_ts-require.cjs tests/r572-my-team-formation-picker-regression.ts
